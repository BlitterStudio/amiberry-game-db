name: Game Settings Update
description: Suggest WHDBooter settings for a WHDLoad game
title: "[Game] "
labels: ["game-update"]
body:
  - type: markdown
    attributes:
      value: |
        Only fill in what should change. Leave everything else empty or on "No change".

        Settings marked **(all versions)** apply to every archive of the game that shares the same folder name, for example all `Turrican2_*.lha` versions. Default slave and data path apply to this archive only.

        A bot replies with the current database entry for the archive and the exact changes needed, and flags other open requests for the same game. See [CONTRIBUTING.md](https://github.com/BlitterStudio/amiberry-game-db/blob/main/CONTRIBUTING.md) for how requests reach Amiberry.

  - type: input
    id: game_name
    attributes:
      label: Game Name
      placeholder: "e.g., Turrican II"
    validations:
      required: true

  - type: input
    id: filename
    attributes:
      label: WHDLoad Archive Filename
      description: The LHA filename without the .lha extension
      placeholder: "e.g., Turrican2_v1.3_Psygnosis"
    validations:
      required: true

  - type: input
    id: sha1
    attributes:
      label: SHA1 Hash
      description: SHA1 of the .lha file, from `sha1sum` (Linux), `shasum -a 1` (macOS) or `Get-FileHash -Algorithm SHA1` (Windows). Amiberry versions after 8.4.1 also log it as "WHDBooter - Archive SHA1". Needed when several archives share the same filename.
      placeholder: "e.g., a1b2c3d4e5..."

  - type: input
    id: amiberry_version
    attributes:
      label: Amiberry Version Tested
      placeholder: "e.g., 8.4.1"
    validations:
      required: true

  - type: dropdown
    id: chipset
    attributes:
      label: Chipset (all versions)
      description: Archives with _AGA or _CD32 in the filename are always AGA.
      options:
        - No change
        - AGA
        - CD32 (AGA with CD32 pads in both ports)
      default: 0

  - type: dropdown
    id: cpu
    attributes:
      label: CPU (all versions)
      description: AGA and CD32 games run on a 68020 unless 68030 or 68040 is selected. 68000 and 68010 apply to non-AGA games only. A 68030, and a 68040 on AGA and CD32 games, need an Amiberry version after 8.4.1; earlier versions use a 68020 instead (or a 68000 for a non-AGA game when an A600 Kickstart ROM is available).
      options:
        - No change
        - "68000"
        - "68010"
        - "68020"
        - "68030"
        - "68040"
      default: 0

  - type: dropdown
    id: clock
    attributes:
      label: CPU Clock Speed (all versions)
      options:
        - No change
        - "7 MHz"
        - "14 MHz"
        - "25 MHz"
        - "28 MHz"
        - Max
      default: 0

  - type: dropdown
    id: cpu_emulation
    attributes:
      label: CPU Emulation (all versions)
      description: |
        Pick one; these modes exclude each other. Amiberry already runs WHDLoad games cycle-exact unless JIT is on. Cycle-exact needs CPU compatible mode, so turning that off also turns cycle-exact off. JIT needs a 68020 or higher: set CPU to 68020, 68030 or 68040, or use an AGA archive.
        The two "Not cycle-exact" options work in Amiberry versions after 8.4.1.
      options:
        - No change
        - Cycle-exact (Amiberry default)
        - Not cycle-exact
        - Not cycle-exact, CPU compatible off
        - JIT (68020 or higher)
      default: 0

  - type: dropdown
    id: z3_ram
    attributes:
      label: Zorro III RAM (all versions)
      options:
        - No change
        - "1 MB"
        - "2 MB"
        - "4 MB"
        - "8 MB"
        - "16 MB"
        - "32 MB"
        - "64 MB"
        - "128 MB"
      default: 0

  - type: dropdown
    id: port0
    attributes:
      label: Port 0 / mouse port (all versions)
      description: Mouse here also makes mouse the primary control.
      options:
        - No change
        - Joystick
        - Mouse
        - CD32 pad
      default: 0

  - type: dropdown
    id: port1
    attributes:
      label: Port 1 / joystick port (all versions)
      options:
        - No change
        - Joystick
        - Mouse
        - CD32 pad
      default: 0

  - type: input
    id: screen_height
    attributes:
      label: Screen Height (all versions)
      description: The Height value from Amiberry's Crop and Offset settings, 1 to 576, or Automatic. Common values are 400, 432, 480, 512, 524, 540 and 568.
      placeholder: "e.g., 512"

  - type: input
    id: screen_width
    attributes:
      label: Screen Width (all versions)
      description: The Width value from Amiberry's Crop and Offset settings, 1 to 754. The default is 720. Width and offsets only take effect when the screen height is not Automatic.
      placeholder: "e.g., 660"

  - type: input
    id: offset_h
    attributes:
      label: Horizontal Screen Offset (all versions)
      description: The H. Offset value from Amiberry's Crop and Offset settings, -754 to 754. Setting an offset turns off horizontal centering.
      placeholder: "e.g., 90"

  - type: input
    id: offset_v
    attributes:
      label: Vertical Screen Offset (all versions)
      description: The V. Offset value from Amiberry's Crop and Offset settings, -576 to 576. Setting an offset turns off vertical centering.
      placeholder: "e.g., 72"

  - type: checkboxes
    id: flags
    attributes:
      label: Settings to Add (all versions)
      description: A ticked box adds that setting to the game. An unticked box changes nothing; it does not remove a setting the game already has. To remove one, say which in Additional Notes.
      options:
        - label: NTSC
        - label: Immediate blitter
        - label: No horizontal centering
        - label: No vertical centering
        - label: Needs extra libraries (e.g. xpk)

  - type: input
    id: default_slave
    attributes:
      label: Default Slave (this archive)
      description: Slave filename to start instead of the current default
      placeholder: "e.g., 3DPool.Slave"

  - type: input
    id: datapath
    attributes:
      label: Data Path (this archive)
      description: Data directory the slave expects
      placeholder: "e.g., data"

  - type: textarea
    id: custom_controls
    attributes:
      label: Custom Controller Mappings (all versions)
      description: One mapping per line, in the format Amiberry writes to .uae files. These replace any existing mappings for the game.
      placeholder: |
        joyport1_amiberry_custom_none_b=Joy2 Up
        joyport1_amiberry_custom_none_x=Space
      render: text

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: What goes wrong without these settings, what you tested, and any setting the game has now that should be removed.
