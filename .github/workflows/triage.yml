name: Triage Game Settings Request

on:
  issues:
    types: [opened, edited, reopened, labeled, closed]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to (re)check
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  # One triage at a time: a run can update other issues' labels.
  group: triage
  cancel-in-progress: false

jobs:
  triage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'game-update') &&
       (github.event.action != 'labeled' || github.event.label.name == 'game-update'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      ACTION: ${{ github.event.action }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Triage the issue and sync duplicate labels
        run: |
          set -euo pipefail

          triage_one() {
            local n=$1 status=0
            python3 converter/triage_issue.py --issue "$n" --output /tmp/comment.md || status=$?
            if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
              return "$status"
            fi

            local comment_id
            comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- game-db-triage -->"))) | .id' | head -n 1)
            if [ -n "$comment_id" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@/tmp/comment.md > /dev/null
            else
              gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
            fi

            if [ "$status" -eq 3 ]; then
              gh issue edit "$n" -R "$GITHUB_REPOSITORY" --add-label duplicate
              return 0
            fi
            # Only take the label off when this workflow put it there; a
            # maintainer's manual duplicate label stays.
            local last_actor has_label
            last_actor=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n/events" --paginate \
              --jq '.[] | select(.event == "labeled" and .label.name == "duplicate") | .actor.login' | tail -n 1)
            has_label=$(gh issue view "$n" -R "$GITHUB_REPOSITORY" --json labels \
              --jq '[.labels[].name] | index("duplicate") != null')
            if [ "$has_label" = "true" ] && [ "$last_actor" = "github-actions[bot]" ]; then
              gh issue edit "$n" -R "$GITHUB_REPOSITORY" --remove-label duplicate
            fi
          }

          if [ "$ACTION" != "closed" ]; then
            triage_one "$ISSUE"
          fi

          # Opening, editing, reopening or closing a request can make other
          # open requests duplicates or clear them. Re-triage every request
          # whose duplicate label does not match its current status.
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            python3 converter/triage_issue.py --list-duplicates | sort > /tmp/should
            gh issue list -R "$GITHUB_REPOSITORY" --state open --label game-update --label duplicate \
              --limit 500 --json number --jq '.[].number' | sort > /tmp/labelled
            for n in $(comm -3 /tmp/should /tmp/labelled | tr -d '\t'); do
              if [ "$n" != "$ISSUE" ]; then
                triage_one "$n"
              fi
            done
          fi
