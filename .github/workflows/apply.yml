name: Apply Accepted Request

# A maintainer adds the `accepted` label to a game-update issue. The run removes
# the label (consuming the approval), applies the request to builder/, checks
# it, commits to main and publishes; the issue is closed with the resulting
# database changes. Anything that needs a person (not in the database, older
# duplicate, values the settings cannot express, failed checks) is reported on
# the issue instead. Adding the label again starts a new run.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to apply
        required: true
        type: number

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: apply-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'accepted' && contains(github.event.issue.labels.*.name, 'game-update'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      UPSTREAM_XML: /tmp/whdload_db.xml
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # Full history: a re-run looks for this request's earlier apply commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Download upstream XML
        run: |
          curl -fsSL -o "$UPSTREAM_XML" \
            "https://raw.githubusercontent.com/HoraceAndTheSpider/Amiberry-XML-Builder/master/whdload_db.xml"

      - name: Keep the request as it was when accepted
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s\n' "$ISSUE_BODY" > /tmp/accepted-body.md

      - name: Apply, check, commit and publish
        env:
          ISSUE_BODY_FILE: ${{ github.event_name == 'issues' && '/tmp/accepted-body.md' || '' }}
          REQUIRE_LABEL: ${{ github.event_name == 'issues' && '1' || '0' }}
        run: bash .github/scripts/apply-request.sh "$ISSUE"
