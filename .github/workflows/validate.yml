name: Validate Database

on:
  pull_request:
    paths:
      - 'builder/**'
      - 'converter/**'
      - 'schema/**'
      - 'whdload_db.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: pr

      # base.sha is the base tip when the PR was opened; the merge ref used
      # above is rebuilt against the current tip, so compare with that.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Reject hand edits to the generated database
        working-directory: pr
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git diff --name-only FETCH_HEAD HEAD | grep -qx 'whdload_db.json'; then
            echo "::error file=whdload_db.json::whdload_db.json is generated by the sync workflow and overwritten daily. Change builder/settings, builder/customcontrols or builder/snippets instead (see CONTRIBUTING.md)."
            exit 1
          fi

      - name: Download upstream XML
        run: |
          curl -fsSL -o /tmp/whdload_db.xml \
            "https://raw.githubusercontent.com/HoraceAndTheSpider/Amiberry-XML-Builder/master/whdload_db.xml"

      - name: Build database with base and PR overrides
        run: |
          python3 base/converter/xml_to_json.py /tmp/whdload_db.xml /tmp/base.json
          python3 pr/converter/xml_to_json.py /tmp/whdload_db.xml /tmp/pr.json --report /tmp/convert.md

      - name: Check overrides and schema
        run: |
          status=0
          python3 pr/converter/check_overrides.py /tmp/pr.json \
            --schema pr/schema/whdload_db.schema.json --report /tmp/check.md || status=$?
          {
            echo "## Checks"
            cat /tmp/check.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Report what this PR changes
        if: always()
        run: |
          {
            echo "## Entries changed by this PR"
            python3 pr/converter/diff_db.py /tmp/base.json /tmp/pr.json
            echo
            echo "## Conversion"
            cat /tmp/convert.md
          } >> "$GITHUB_STEP_SUMMARY"
