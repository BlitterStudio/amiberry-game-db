name: Sync WHDLoad Database

on:
  schedule:
    # Run daily at 08:00 UTC (after Horace's 07:00 UTC build)
    - cron: '0 8 * * *'
  push:
    branches: [main]
    paths:
      - 'builder/settings/**'
      - 'builder/customcontrols/**'
      - 'builder/snippets/**'
      - 'converter/**'
      - 'schema/**'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      has_db: ${{ steps.check.outputs.has_db }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Download upstream XML
        run: |
          curl -fsSL -o /tmp/whdload_db.xml \
            "https://raw.githubusercontent.com/HoraceAndTheSpider/Amiberry-XML-Builder/master/whdload_db.xml"
          echo "XML size: $(wc -c < /tmp/whdload_db.xml) bytes"
          echo "Game count: $(grep -c '<game ' /tmp/whdload_db.xml)"

      - name: Convert XML to JSON and apply overrides
        run: |
          python3 converter/xml_to_json.py /tmp/whdload_db.xml /tmp/whdload_db.json --report /tmp/convert.md
          {
            echo "## Conversion"
            cat /tmp/convert.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check overrides and schema
        run: |
          status=0
          python3 converter/check_overrides.py /tmp/whdload_db.json \
            --schema schema/whdload_db.schema.json --report /tmp/check.md || status=$?
          {
            echo "## Checks"
            cat /tmp/check.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Report changes against the published database
        run: |
          {
            echo "## Changes since the last sync"
            python3 converter/diff_db.py whdload_db.json /tmp/whdload_db.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changes
        run: |
          cp /tmp/whdload_db.json whdload_db.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add whdload_db.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            GAME_COUNT=$(python3 -c "import json; print(json.load(open('whdload_db.json'))['game_count'])")
            git commit -m "sync: update WHDLoad database (${GAME_COUNT} games)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Check DB exists
        id: check
        run: |
          if [ -f whdload_db.json ]; then
            echo "has_db=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_db=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: sync
    if: needs.sync.outputs.has_db == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Prepare pages content
        run: |
          mkdir -p _site
          cp whdload_db.json _site/
          cp schema/whdload_db.schema.json _site/
          echo '{"status":"ok","file":"whdload_db.json"}' > _site/index.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - uses: actions/deploy-pages@v5
        id: deployment
